version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: votar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-votar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-votar_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-votar_db}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-votar}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: votar_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-votar}:${POSTGRES_PASSWORD:-votar_dev_password}@postgres:5432/${POSTGRES_DB:-votar_db}
      NODE_ENV: development
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
